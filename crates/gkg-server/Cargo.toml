[package]
name = "gkg-server"
version.workspace = true
edition = "2024"
license = "MIT"

[[bin]]
name = "gkg-server"
path = "src/main.rs"

[features]
default = []
regenerate-protos = []
testkit = ["gkg-analytics/testkit"]
# FIPS: flip the shared rustls crypto provider to its FIPS backend. rustls's
# own `fips` feature enables `aws-lc-rs/fips` (the validated aws-lc-fips-sys
# module) AND `webpki/aws-lc-rs-fips`, so the whole rustls-based TLS stack
# (tonic `tls-aws-lc`, clickhouse `rustls-tls-aws-lc`, hyper-rustls, rcgen) uses
# the FIPS module via Cargo feature unification — gkg-server already installs
# the aws_lc_rs provider (`rustls::crypto::aws_lc_rs::default_provider()`), so no
# runtime code changes. This is the ecosystem-canonical switch, deliberately via
# `rustls/fips` rather than a bespoke `aws-lc-rs/fips` toggle (which would miss
# `webpki/aws-lc-rs-fips`).
#
# NOTE: `aws-lc-sys` (the non-FIPS backend) is still COMPILED but UNUSED: rustls's
# `aws_lc_rs` feature hardcodes `aws-lc-rs/aws-lc-sys`, and there is no rustls
# feature that provides the provider without it. `aws-lc-rs` `extern crate`s only
# `aws-lc-fips-sys` when `fips` is set (the two sys crates have distinct `links`
# keys, so they coexist with no collision and only the FIPS module is linked).
# Dropping the unused build would require an upstream rustls change.
fips = ["rustls/fips"]

[dependencies]
mimalloc = { workspace = true, features = ["secure"] }
anyhow = { workspace = true }
arrow = { workspace = true }
moka = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
clickhouse-client = { path = "../clickhouse-client" }
gkg-analytics = { path = "../gkg-analytics" }
gkg-billing = { path = "../gkg-billing" }
gkg-observability = { workspace = true }
gkg-prompts = { path = "../gkg-prompts" }
gkg-server-config = { path = "../gkg-server-config" }
gkg-utils = { path = "../utils" }
health-check = { workspace = true }
indexer = { path = "../indexer" }
minijinja = { workspace = true }
named-queries = { path = "../named-queries" }
nats-client = { workspace = true }
ontology = { path = "../ontology" }
opentelemetry = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
query-engine = { path = "../query-engine" }
gitlab-client = { workspace = true }
jsonschema = { workspace = true }
jsonwebtoken = { workspace = true }
labkit = { workspace = true, features = ["http", "grpc", "otel", "prometheus"] }
labkit-events = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
strum = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util.workspace = true
tokio-stream = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
toon-format = { workspace = true }

[build-dependencies]
compiler = { path = "../query-engine/compiler" }
gkg-prompts = { path = "../gkg-prompts" }
named-queries = { path = "../named-queries" }
ontology = { path = "../ontology" }
tonic-prost-build = { workspace = true }

[dev-dependencies]
gkg-analytics = { path = "../gkg-analytics", features = ["testkit"] }
tokio = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }

[lints.rust]
# workspace uses `forbid`, downgraded to `deny` so tests can manipulate env vars
unsafe_code = "deny"
